[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "custom-image-viewer"
version = "1.1.0"
description = "A custom image viewer with EXIF metadata support and interactive map visualization."
requires-python = ">=3.10"
dependencies = [
    "ttkbootstrap>=1.10.1",
    "Pillow>=10.0.0",
    "pyexiv2>=2.14.0",
    "geopy>=2.4.1",
    "folium>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
image-viewer = "custom_image_viewer.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/custom_image_viewer"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
